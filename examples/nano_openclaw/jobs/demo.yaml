schema_version: "1.0"
name: durable-conversation-demo
description: Channel continuity, wakeup dedupe, scheduled input, and delivery recovery.
fixture_files:
  project/brief.txt: >-
    Gateway sessions route messages without mutating their workspace.
messages:
  - envelope:
      message_id: demo-message-1
      channel: mock
      account_id: primary
      conversation_id: conversation-1
      sender_id: user-1
      content: Read project/brief.txt and summarize the gateway requirement.
      received_at: "2026-08-07T12:00:00Z"
    responses:
      - content: I will inspect the project brief.
        tool_calls:
          - call_id: demo_read_1
            name: workspace_read
            arguments: {path: project/brief.txt}
      - content: I have a concise response ready.
        tool_calls:
          - call_id: demo_submit_1
            name: response_submit
            arguments:
              answer: Gateway sessions route messages without mutating their workspace.
      - content: Response submitted for host review.
  - envelope:
      message_id: demo-message-2
      channel: mock
      account_id: primary
      conversation_id: conversation-1
      sender_id: user-1
      content: What did you just establish?
      received_at: "2026-08-07T12:01:00Z"
    responses:
      - content: I can answer from the persisted conversation.
        tool_calls:
          - call_id: demo_submit_2
            name: response_submit
            arguments:
              answer: We established that gateway sessions route messages without mutating their workspace.
      - content: Follow-up response submitted for host review.
schedules:
  - name: scheduled-check
    prompt: Report the durable gateway rule as a trusted scheduled wakeup.
    channel: mock
    account_id: primary
    conversation_id: conversation-1
    sender_id: user-1
    delay_seconds: 0
    responses:
      - content: I received a trusted schedule event, not a user message.
        tool_calls:
          - call_id: demo_schedule_submit
            name: response_submit
            arguments:
              answer: Scheduled check confirms that gateway sessions route messages without mutating their workspace.
      - content: Scheduled response submitted for host review.
