schema_version: "1.0"
name: inspect-workspace
description: Deterministic NanoOpenClaw smoke scenario.
query: Read project/brief.txt and summarize the requirement.
fixture_files:
  project/brief.txt: >-
    Gateway sessions route messages without mutating their workspace.
responses:
  - content: I will inspect the gateway requirement.
    tool_calls:
      - call_id: example_read_1
        name: workspace_read
        arguments: {path: project/brief.txt}
  - content: NanoOpenClaw separates message routing from workspace mutation.
expect:
  success: true
  min_steps: 2
  required_tools: [workspace_read]
