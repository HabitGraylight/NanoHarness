schema_version: "1.0"
name: nano-openclaw
description: >-
  Durable multi-source conversation host with application-owned wakeup trust,
  routing, turn recovery, outbound approval, and separable delivery policy.

host:
  capabilities:
    - runtime.context
    - tools.workspace-read
    - surface.gateway
    - routing.conversations
    - turns.resumable
    - wakeups.normalized
    - wakeups.trust-tiered
    - policy.outbound-approval
    - delivery.separable
  services:
    - llm.gateway
    - context.conversation
    - state.turn
    - hooks.gateway
    - evaluator.turn
    - policy.gateway
    - executor.gateway
    - events.turn

engine:
  llm_service: llm.gateway
  context_service: context.conversation
  state_service: state.turn
  hooks_service: hooks.gateway
  evaluator_service: evaluator.turn
  policy_service: policy.gateway
  executor_service: executor.gateway
  event_sink_service: events.turn
  max_steps: 8

extensions:
  - name: channels.durable
    config:
      persist_path: "${runtime}/channels/state.json"
      events_path: "${runtime}/channels/events.jsonl"
      service_name: channels
      mock_channels: [mock, console, webhook]
      claim_lease_seconds: 3600
      recover: true
  - name: scheduler.local
    config:
      persist_path: "${runtime}/schedules.json"
      service_name: scheduler
      start_checker: false

metadata:
  family: gateway
  style: openclaw
  surface: multi-channel-conversation-gateway
  policy_mode: gateway
  context_lifetime: persistent-conversation
  channels: [console, webhook, mock]
  wakeup_sources: [channel, schedule, background, manual]
  delivery_mode: generate-then-review-then-deliver
  boundary: normalized-envelope-no-http-server
