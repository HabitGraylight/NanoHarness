schema_version: "1.0"
name: nano-openclaw
description: >-
  Minimal persistent gateway harness for console, webhook, and mock channels.

host:
  capabilities:
    - runtime.context
    - tools.workspace
    - surface.gateway
    - routing.sessions
    - channels.console
    - channels.webhook
    - channels.mock
  services:
    - llm.gateway
    - context.session
    - state.gateway
    - hooks.gateway
    - evaluator.delivery
    - policy.gateway
    - approval.gateway
    - executor.gateway
    - events.artifacts

engine:
  llm_service: llm.gateway
  context_service: context.session
  state_service: state.gateway
  hooks_service: hooks.gateway
  evaluator_service: evaluator.delivery
  policy_service: policy.gateway
  approval_broker_service: approval.gateway
  executor_service: executor.gateway
  event_sink_service: events.artifacts
  max_steps: 8

extensions:
  - name: scheduler.local
    config:
      persist_path: "${runtime}/schedules.json"
      start_checker: false
  - name: background.shell
    config:
      workspace_root: "${workspace}"
      scratch_dir: "${workspace}/.nano_openclaw/scratch"
      max_concurrent: 2
  - name: memory.file
    config:
      directory: "${runtime}/memory"
  - name: skills.directory
    enabled: false

metadata:
  family: gateway
  style: openclaw
  surface: multi-channel-gateway
  policy_mode: gateway
  context_lifetime: persistent-session
  channels: [console, webhook, mock]
