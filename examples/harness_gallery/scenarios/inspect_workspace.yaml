schema_version: "1.0"
name: inspect-workspace
description: Read a fixture file and finish without network or workspace mutation.
query: Read project/brief.txt and summarize what the Gallery must demonstrate.

fixture_files:
  project/brief.txt: >-
    One composable kernel should support interactive coding, controlled coding,
    and persistent gateway harnesses without hiding their policy differences.

responses:
  - content: I will inspect the shared fixture first.
    tool_calls:
      - call_id: gallery_read_1
        name: workspace_read
        arguments:
          path: project/brief.txt
  - content: >-
      The fixture requires one composable kernel with visibly different
      interactive, controlled, and gateway policies.

expect:
  success: true
  min_steps: 2
  required_tools: [workspace_read]
